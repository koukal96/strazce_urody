<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,500;1,600;1,700&amp;family=Inter:ital,wght@0,700;0,900;1,400;1,700&amp;display=swap">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../css/kontakt.css">
</head>
<body>
<div class="kontakt">
  <div class="kontakt__navigation">
    <div class="c-navigation">
      <a class="c-navigation__logo sf-a" href="../">
        <div class="c-navigation__frame">
          <img class="sf-fill" src="../assets/images/stack.png" alt="" loading="lazy">
        </div>
      </a>
      <div class="c-navigation__menu-button">
        <div class="c-navigation__line"></div>
        <div class="c-navigation__line-2"></div>
      </div>
      <div class="c-navigation__links">
        <div class="c-navigation__navlink1">
          <a class="c-navlink1 sf-a" href="../#uvod">
            <p class="c-navlink1__uvod"></p>
          </a>
        </div>
        <div class="c-navigation__navlink">
          <a class="c-navlink sf-a" href="/o-mne">
            <p class="c-navlink__o-mne"></p>
          </a>
        </div>
        <div class="c-navigation__button">
          <a class="c-button sf-a" href="../kontakt/">
            <p class="c-button__kontakt"></p>
          </a>
        </div>
      </div>
    </div>
  </div>
  <div class="kontakt__contact-section">
    <div class="kontakt__contact-texts-wrap">
      <div class="kontakt__contact-text-wrap">
        <h1 class="kontakt__kontakt ts-text-styles-heading-1"></h1>
        <p class="kontakt__v-pripade-jakychkoli-dotazu ts-text-styles-paragraph-big"></p>
      </div>
      <div class="kontakt__contact-text-wrap-2">
        <h3 class="kontakt__ozvi-se-mi ts-text-styles-heading-3"></h3>
        <p class="kontakt__bc-jan-koukalico-21225753tel ts-text-styles-paragraph-big"></p>
      </div>
    </div>
    <div class="kontakt__form">
      <p class="kontakt__vypln-formular"></p>
      <div class="kontakt__frame">
        <div class="kontakt__label"></div>
        <div class="kontakt__label-2"></div>
      </div>
      <div class="kontakt__label-3"></div>
      <div class="kontakt__label-4"></div>
      <div class="kontakt__label-5"></div>
      <div class="kontakt__button-form">
        <div class="c-button-3">
          <p class="c-button-3__odeslat-zpravu"></p>
          <div class="c-button-3__spinner">
            <div class="c-button-3__conic">
              <div class="c-button-3__rounding"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="kontakt__footer-section">
    <div class="c-footer-section-2">
      <div class="c-footer-section-2__work-with-wrap">
        <p class="c-footer-section-2__spolupracuji-s ts-text-styles-paragraph-small"></p>
        <div class="c-footer-section-2__frame">
          <img class="sf-fill" src="../assets/images/image-2.png" alt="pix4d tool" loading="lazy">
        </div>
      </div>
      <div class="c-footer-section-2__footer-navlink">
        <a class="c-footer-navlink sf-a" href="/ochrana-osobních-údajů" target="_blank" rel="noopener">
          <p class="c-footer-navlink__ochrana-osobnich-udaju ts-text-styles-body"></p>
        </a>
      </div>
      <div class="c-footer-section-2__footer-navlink-2">
        <a class="c-footer-navlink sf-a" href="/ochrana-osobních-údajů" target="_blank" rel="noopener">
          <p class="c-footer-navlink__ochrana-osobnich-udaju ts-text-styles-body"></p>
        </a>
      </div>
      <div class="c-footer-section-2__footer-navlink-3">
        <a class="c-footer-navlink sf-a" href="/ochrana-osobních-údajů" target="_blank" rel="noopener">
          <p class="c-footer-navlink__ochrana-osobnich-udaju ts-text-styles-body"></p>
        </a>
      </div>
      <div class="c-footer-section-2__social-icons-wrap">
        <a class="c-footer-section-2__frame-2 sf-a" href="https://www.instagram.com/janek_koukal?igsh=MWY3cG92b2hqdmMxbA%3D%3D&amp;utm_source=qr" target="_blank" rel="noopener">
          <img class="sf-fill" src="../assets/images/image-3.svg" alt="" loading="lazy">
        </a>
        <a class="c-footer-section-2__frame-3 sf-a" href="https://www.facebook.com/share/1KtkwofE6z/?mibextid=wwXIfr" target="_blank" rel="noopener">
          <img class="sf-fill" src="../assets/images/image.svg" alt="" loading="lazy">
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
