<!DOCTYPE html><html lang="cs-CZ"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <title>Stránka nenalezena | Strážce úrody</title>
  <style>
    :root {
      --background: #fff;
      --text: #666;
      --text-title: #222;
      --button-background: #004300;
      --button-background-hover: #005900;
      --button-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111;
        --text: #999;
        --text-title: #fff;
        --button-background: #eaee56;
        --button-background-hover: #dfe33a;
        --button-text: #004300;
        color-scheme: dark;
      }
    }
    html { height: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      display: flex; box-sizing: border-box; padding: 24px; min-height: 100%;
      flex-direction: column; align-items: center; justify-content: center; margin: 0;
      background-color: var(--background); color: var(--text);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h1 { max-width: 260px; margin: 15px 0 10px; text-align: center; text-wrap: balance; color: var(--text-title); font-size: 18px; font-weight: 600; line-height: 1.2; }
    p { max-width: 280px; margin: 0; font-size: 14px; font-weight: 450; line-height: 1.4; text-align: center; text-wrap: balance; }
    a {
      display: inline-flex; height: 36px; box-sizing: border-box; padding: 0 16px; margin-top: 18px;
      background-color: var(--button-background); border-radius: 100px; color: var(--button-text);
      font-size: 14px; font-weight: 600; line-height: 1; place-content: center; place-items: center;
      text-decoration: none; transition: background-color 120ms ease;
    }
    a:hover { background-color: var(--button-background-hover); }
  </style>
</head><body>
  <h1>Stránka nenalezena</h1>
  <p>Tato stránka neexistuje nebo byla přesunuta.</p>
  <a href="index.html">Zpět na hlavní stránku</a>
</body></html>
